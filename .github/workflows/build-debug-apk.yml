name: Build Debug APK

on:
  push:
    branches:
      - '**'          # every branch push triggers a build
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # manual trigger button in GitHub Actions UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch whisper.cpp submodule if present; skip silently if absent
          submodules: false

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Android SDK + NDK ───────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653" --sdk_root=$ANDROID_SDK_ROOT
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install CMake 3.22.1
        run: echo "y" | sdkmanager "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT

      # ── 4. Download whisper.cpp for native STT ─────────────────────────────
      - name: Download whisper.cpp
        run: |
          git clone --depth=1 \
            https://github.com/ggerganov/whisper.cpp \
            app/src/main/cpp/whisper.cpp
          echo "whisper.cpp cloned: $(ls app/src/main/cpp/whisper.cpp | head -5)"

      # ── 6. Gradle wrapper jar (bootstrap if missing) ───────────────────────
      - name: Bootstrap Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, bootstrapping…"
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.6-bin.zip" \
              -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
            /tmp/gradle-dist/gradle-8.6/bin/gradle wrapper \
              --gradle-version 8.6 \
              --distribution-type bin
          else
            echo "gradle-wrapper.jar present"
          fi
          chmod +x gradlew

      # ── 5. Gradle cache ────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 6. Build ───────────────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # ── 7. Rename APK with branch + commit info ────────────────────────────
      - name: Rename APK
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          DATE=$(date +%Y%m%d)
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_NAME="whisperLM-debug-${BRANCH}-${DATE}-${SHORT_SHA}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "APK_PATH=$APK_NAME" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "Built: $APK_NAME ($(du -sh $APK_NAME | cut -f1))"

      # ── 8. Upload APK as artifact (keeps for 30 days) ─────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error

      # ── 9. Print download instructions ────────────────────────────────────
      - name: Install instructions
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║               📱  How to install on your phone               ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  1. Go to Actions tab → this workflow run                    ║"
          echo "║  2. Scroll to 'Artifacts' section at the bottom              ║"
          echo "║  3. Click the APK artifact to download a .zip file           ║"
          echo "║  4. Unzip to get the .apk file                               ║"
          echo "║  5. Transfer to phone via USB / Google Drive / AirDrop       ║"
          echo "║  6. On phone: Settings → Security → Install unknown apps     ║"
          echo "║  7. Tap the .apk file to install                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "APK: ${{ env.APK_NAME }}"

  # ── Optional: also create a GitHub Release on version tags ────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: 'whisperLM-debug-*'
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: whisperLM ${{ github.ref_name }}
          body: |
            ## whisperLM ${{ github.ref_name }} — Debug Build

            ### Install on your Android phone
            1. Download the `.apk` from the Assets below
            2. Transfer to your phone (USB / cloud storage)
            3. On phone: **Settings → Security → Install unknown apps** → enable for your file manager
            4. Tap the `.apk` to install

            ### First run
            The setup wizard will guide you through copying your AI model files:
            - **Whisper model** (`.bin`) — for speech-to-text
            - **LLM model** (`.task` or `.gguf`) — for the chat feature (optional)

            See `SETUP.md` for model download links.
          files: '*.apk'
          draft: false
          prerelease: true
